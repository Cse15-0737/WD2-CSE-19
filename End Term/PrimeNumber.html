
<!DOCTYPE html>
<html>
<head>
    <title>Prime Number Check</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 100px;">
<div style="margin-bottom: 20px; font-size: 18px; background-color: aquamarine; width: 50%; margin-left: 25%; height: auto;">
    <h2>Prime Number Checker</h2>
    <input type="number" id="num" placeholder="Enter a number"
           style="padding: 10px; font-size: 16px;">

    <button onclick="checkPrime()"
            style="padding: 10px; font-size: 16px;">
        Check
    </button>
    </div>

    <div id="result"
         style="margin-top: 20px; font-size: 20px; font-weight: bold;">
    </div>

    <script src="PrimeNumber.js"></script>

</body>
</html>
